name: GTA Daily Videos

on:
  schedule:
    # 2 long videos (UTC)
    - cron: "0 12 * * *"
    - cron: "0 2 * * *"
    # 3 shorts (UTC)
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "short ya long"
        default: "short"
      dry_run:
        description: "1 = sirf video banao, upload mat karo (test)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: gta-daily-videos
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Make and upload one video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MODE: ${{ (github.event.schedule == '0 12 * * *' || github.event.schedule == '0 2 * * *') && 'long' || github.event.inputs.mode || 'short' }}
        run: python main.py

      - name: Save used topics
        run: |
          git config user.name "video-bot"
          git config user.email "bot@users.noreply.github.com"
          cp used_topics.json /tmp/mine.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python -c "import json;a=json.load(open('used_topics.json'));b=json.load(open('/tmp/mine.json'));json.dump(a+[x for x in b if x not in a],open('used_topics.json','w'),indent=1)"
            git add used_topics.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "update used topics"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
